<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fábrica de software · wow-armory</title>
  <style>
    :root {
      --bg: #f4f2ed;
      --grid: rgba(23, 24, 26, 0.035);
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --ink: #18191b;
      --muted: #6d7076;
      --line: #e4e0d8;
      --line-strong: #d5d0c6;
      --accent: #315e51;
      --accent-soft: #e7efeb;
      --pass: #2f7d58;
      --pass-soft: #e5f2ea;
      --changes: #a9641f;
      --changes-soft: #f9eddc;
      --pending: #8b8d91;
      --pending-soft: #efeee9;
      --human: #b03a3a;
      --human-soft: #fbeaea;
      --shadow: 0 1px 2px rgba(23, 24, 26, 0.04), 0 8px 24px rgba(23, 24, 26, 0.04);
      --radius: 14px;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141514;
        --grid: rgba(255, 255, 255, 0.035);
        --surface: #1d1f1e;
        --surface-soft: #202220;
        --ink: #f2f0eb;
        --muted: #a4a7a3;
        --line: #303330;
        --line-strong: #3d413d;
        --accent: #8cc6b2;
        --accent-soft: #23352f;
        --pass: #7fcca3;
        --pass-soft: #203229;
        --changes: #e0a565;
        --changes-soft: #35291c;
        --pending: #9b9e9a;
        --pending-soft: #282b28;
        --human: #ef8a8a;
        --human-soft: #3a2222;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 12px 30px rgba(0, 0, 0, 0.18);
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    code, pre { font-family: var(--mono); }

    .shell { max-width: 1580px; margin: 0 auto; padding: 40px 28px 56px; }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 28px;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-weight: 650;
    }
    .top p { margin: 10px 0 0; color: var(--muted); font-size: 14px; max-width: 520px; }

    .stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .stat {
      min-width: 88px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .stat b { display: block; font-size: 20px; line-height: 1; letter-spacing: -0.02em; }
    .stat span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
    .stat.human b { color: var(--human); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 16px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
    }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .legend-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; margin-right: 2px; }
    .server-hint { color: var(--muted); font-size: 12px; text-align: right; }
    .server-hint code { padding: 2px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-soft); font-size: 11px; }

    .alert {
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid color-mix(in srgb, var(--human) 40%, var(--line));
      border-radius: 12px;
      background: var(--human-soft);
      color: var(--ink);
      font-size: 13px;
    }
    .alert strong { color: var(--human); }
    .alert code { font-size: 12px; }

    .pipeline {
      display: flex;
      gap: 12px;
      align-items: stretch;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
    }
    .column {
      flex: 0 0 238px;
      min-height: 210px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 72%, transparent);
      padding: 12px;
    }
    .column > header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px 12px;
    }
    .column h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .column header span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .column header b {
      min-width: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--pending-soft);
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }
    .column[data-stage="needs-human"] { border-color: color-mix(in srgb, var(--human) 45%, var(--line)); background: color-mix(in srgb, var(--human-soft) 45%, var(--surface)); }
    .column[data-stage="needs-human"] h2 { color: var(--human); }
    .column[data-stage="done"] { opacity: 0.82; }

    .cards { display: flex; flex-direction: column; gap: 9px; }
    .empty-col { margin: 4px 2px; color: var(--muted); font-size: 12px; }

    .card {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: 0 2px 3px rgba(23, 24, 26, 0.05), 0 14px 34px rgba(23, 24, 26, 0.07); }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .card.human { border-color: color-mix(in srgb, var(--human) 55%, var(--line)); background: linear-gradient(180deg, var(--human-soft), var(--surface) 70%); }
    .card.human::before {
      content: "needs human";
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--human);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .job-id { color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: -0.01em; }
    .status {
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--pending-soft);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .status.running { background: var(--accent-soft); color: var(--accent); }
    .status.blocked { background: var(--human-soft); color: var(--human); }
    .status.done { background: var(--pass-soft); color: var(--pass); }
    .card h3 { margin: 8px 0 6px; font-size: 13px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; }
    .meta { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }

    .rounds { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
    .round { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .round-tag { margin-right: 2px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 0.05em; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--pending-soft);
      color: var(--pending);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.5;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .chip.pass { background: var(--pass-soft); color: var(--pass); }
    .chip.changes { background: var(--changes-soft); color: var(--changes); }
    .chip.pending { background: var(--pending-soft); color: var(--pending); }
    .decision { margin-top: 9px; color: var(--muted); font-size: 10px; }
    .decision .chip { margin-left: 4px; }

    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 40;
      width: min(620px, 100vw);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: var(--surface);
      box-shadow: -24px 0 60px rgba(0, 0, 0, 0.14);
    }
    .drawer:not([hidden]) { animation: slide-in 180ms ease-out; }
    @keyframes slide-in { from { transform: translateX(28px); opacity: 0.4; } to { transform: none; opacity: 1; } }

    .drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-head h2 { margin: 5px 0 0; font-size: 20px; line-height: 1.2; letter-spacing: -0.025em; }
    .icon-btn {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .icon-btn:hover { border-color: var(--line-strong); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 18px 0; border-bottom: 1px solid var(--line); }
    .tab {
      flex: 0 0 auto;
      padding: 8px 9px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { border-bottom-color: var(--accent); color: var(--ink); }
    .tab.missing { opacity: 0.45; }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .markdown {
      flex: 1;
      overflow: auto;
      padding: 22px 26px 56px;
      font-size: 14px;
      line-height: 1.65;
    }
    .markdown > :first-child { margin-top: 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { letter-spacing: -0.02em; line-height: 1.25; }
    .markdown h1 { margin: 28px 0 12px; font-size: 24px; }
    .markdown h2 { margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 17px; }
    .markdown h3 { margin: 20px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .markdown p { margin: 9px 0; }
    .markdown ul { margin: 9px 0; padding-left: 20px; }
    .markdown li { margin: 4px 0; }
    .markdown code { padding: 1px 5px; border-radius: 5px; background: var(--surface-soft); border: 1px solid var(--line); font-size: 0.88em; }
    .markdown pre { margin: 14px 0; padding: 12px 14px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
    .markdown pre code { padding: 0; border: 0; background: transparent; font-size: 12px; line-height: 1.55; }
    .markdown blockquote { margin: 12px 0; padding: 4px 0 4px 14px; border-left: 3px solid var(--line-strong); color: var(--muted); }
    .markdown hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line); }
    .markdown a { color: var(--accent); }
    .markdown .empty { color: var(--muted); }
    .pending { max-width: 460px; color: var(--muted); }
    .pending strong { color: var(--ink); }
    .pending ul { columns: 2; column-gap: 20px; }

    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 12, 11, 0.34); backdrop-filter: blur(1px); }
    .scrim:not([hidden]) { animation: fade-in 160ms ease-out; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 760px) {
      .shell { padding: 24px 16px 40px; }
      .top { flex-direction: column; align-items: flex-start; gap: 16px; }
      .stats { justify-content: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; gap: 8px; }
      .server-hint { text-align: left; }
      .column { flex-basis: 82vw; }
      .drawer { width: 100vw; }
      .drawer-head, .markdown { padding-left: 18px; padding-right: 18px; }
      .tabs { padding-left: 12px; padding-right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <span class="eyebrow">wow-armory</span>
        <h1>Fábrica de software</h1>
        <p>Features en tránsito por spec, build, revisión y decisión. Todo el estado vive en <code>board.json</code>.</p>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
    </header>

    <div class="toolbar">
      <div class="legend">
        <span class="legend-label">Revisores</span>
        <span class="chip pass">PASS</span>
        <span class="chip changes">CHANGES</span>
        <span class="chip pending">pendiente</span>
      </div>
      <div class="server-hint" id="serverHint">Actualizando…</div>
    </div>

    <div class="alert" id="alert" hidden></div>

    <section class="pipeline" id="pipeline" aria-label="Etapas de la fábrica"></section>
  </main>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" hidden aria-label="Archivos del trabajo">
    <div class="drawer-head">
      <div>
        <span class="job-id" id="drawerId"></span>
        <h2 id="drawerTitle"></h2>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="Cerrar panel" title="Cerrar">×</button>
    </div>
    <nav class="tabs" id="fileTabs" aria-label="Archivos del trabajo"></nav>
    <div class="markdown" id="fileBody"></div>
  </aside>

  <script>
    const STAGES = [
      { key: 'feature', label: 'Feature', hint: 'pendiente en backlog' },
      { key: 'spec', label: 'Spec', hint: 'spec-writer' },
      { key: 'build', label: 'Build', hint: 'builder' },
      { key: 'review', label: 'Revisión', hint: '4 revisores en paralelo' },
      { key: 'decision', label: 'Decisión', hint: 'approver' },
      { key: 'merge', label: 'Merge', hint: 'hacia main' },
      { key: 'needs-human', label: 'Needs human', hint: 'requiere una persona' },
      { key: 'done', label: 'Hecho', hint: 'mergeado en main' }
    ];
    const REVIEWERS = [
      ['security', 'SEC'],
      ['ux', 'UX'],
      ['ui', 'UI'],
      ['code', 'CODE']
    ];
    const KNOWN_STAGES = new Set(STAGES.map(function (s) { return s.key; }));

    var board = { jobs: [] };
    var selectedId = null;
    var lastSignature = '';
    var drawerToken = 0;

    var pipelineEl = document.getElementById('pipeline');
    var statsEl = document.getElementById('stats');
    var alertEl = document.getElementById('alert');
    var serverHintEl = document.getElementById('serverHint');
    var drawerEl = document.getElementById('drawer');
    var scrimEl = document.getElementById('scrim');
    var drawerIdEl = document.getElementById('drawerId');
    var drawerTitleEl = document.getElementById('drawerTitle');
    var fileTabsEl = document.getElementById('fileTabs');
    var fileBodyEl = document.getElementById('fileBody');

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function escAttr(value) { return escapeHtml(value); }

    function inlineMd(text) {
      var html = escapeHtml(text);
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
      html = html.replace(/^\[( |x)\]\s+/, function (_, mark) { return mark === 'x' ? '☑ ' : '☐ '; });
      return html;
    }

    function renderMarkdown(source) {
      if (!source) return '<p class="empty">Archivo pendiente.</p>';
      var lines = String(source).replace(/\r/g, '').split('\n');
      var out = [];
      var inCode = false;
      var inList = false;
      function closeList() { if (inList) { out.push('</ul>'); inList = false; } }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (/^```/.test(line.trim())) {
          if (inCode) { out.push('</code></pre>'); inCode = false; }
          else { closeList(); var lang = line.trim().slice(3).trim(); out.push('<pre><code' + (lang ? ' class="lang-' + escAttr(lang) + '"' : '') + '>'); inCode = true; }
          continue;
        }
        if (inCode) { out.push(escapeHtml(line)); continue; }
        if (!/^\s*[-*] /.test(line)) closeList();

        var heading = line.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          var level = heading[1].length;
          out.push('<h' + level + '>' + inlineMd(heading[2]) + '</h' + level + '>');
          continue;
        }
        if (/^\s*[-*] /.test(line)) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push('<li>' + inlineMd(line.replace(/^\s*[-*] /, '')) + '</li>');
          continue;
        }
        if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); continue; }
        if (line.trim() === '') { out.push(''); continue; }
        if (/^\s*>\s?/.test(line)) { out.push('<blockquote>' + inlineMd(line.replace(/^\s*>\s?/, '')) + '</blockquote>'); continue; }
        out.push('<p>' + inlineMd(line) + '</p>');
      }
      closeList();
      if (inCode) out.push('</code></pre>');
      return out.join('\n');
    }

    function normalizeStage(stage) {
      return KNOWN_STAGES.has(stage) ? stage : 'feature';
    }

    function jobs() {
      return Array.isArray(board.jobs) ? board.jobs : [];
    }

    function findJob(id) {
      var list = jobs();
      for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === id) return list[i];
      return null;
    }

    function chip(label, verdict) {
      var value = verdict || 'pending';
      var cls = value === 'PASS' ? 'pass' : value === 'CHANGES' ? 'changes' : 'pending';
      return '<span class="chip ' + cls + '" title="' + escAttr(label + ': ' + value) + '">' + label + '</span>';
    }

    function cardHtml(job) {
      var rounds = Array.isArray(job.reviews) ? job.reviews : [];
      var roundRows = rounds.map(function (round) {
        return '<div class="round"><span class="round-tag">R' + escapeHtml(round.round || '?') + '</span>' +
          REVIEWERS.map(function (reviewer) { return chip(reviewer[1], round[reviewer[0]]); }).join('') +
          '</div>';
      }).join('');
      var decision = job.decision
        ? '<div class="decision">Decisión ' + chip(job.decision === 'APPROVE' ? 'APPROVE' : 'ESCALATE', job.decision) + '</div>'
        : '';
      var human = job.needsHuman === true || job.stage === 'needs-human';
      var status = job.status || 'pending';
      var meta = 'Ronda ' + (Number(job.round) || 0) + '/' + (Number(job.maxRounds) || 2) +
        (job.branch ? ' · ' + escapeHtml(job.branch) : '');
      return '<article class="card' + (human ? ' human' : '') + '" data-job="' + escAttr(job.id) + '" tabindex="0" role="button" aria-label="Abrir ' + escAttr(job.title || job.id) + '">' +
        '<div class="card-head"><span class="job-id">' + escapeHtml(job.id) + '</span>' +
        '<span class="status ' + escAttr(status) + '">' + escapeHtml(job.stage || 'feature') + '</span></div>' +
        '<h3>' + escapeHtml(job.title || job.id) + '</h3>' +
        '<p class="meta">' + meta + '</p>' +
        (roundRows ? '<div class="rounds">' + roundRows + '</div>' : '') +
        decision +
        '</article>';
    }

    function renderStats() {
      var list = jobs();
      var running = list.filter(function (job) { return job.status === 'running'; }).length;
      var human = list.filter(function (job) { return job.needsHuman === true || job.stage === 'needs-human'; }).length;
      var done = list.filter(function (job) { return job.stage === 'done'; }).length;
      statsEl.innerHTML =
        '<div class="stat"><b>' + list.length + '</b><span>trabajos</span></div>' +
        '<div class="stat"><b>' + running + '</b><span>en curso</span></div>' +
        '<div class="stat human"><b>' + human + '</b><span>needs human</span></div>' +
        '<div class="stat"><b>' + done + '</b><span>hechos</span></div>';
    }

    function render() {
      renderStats();
      pipelineEl.innerHTML = STAGES.map(function (stage) {
        var items = jobs().filter(function (job) { return normalizeStage(job.stage) === stage.key; });
        return '<section class="column" data-stage="' + stage.key + '">' +
          '<header><div><h2>' + stage.label + '</h2><span>' + stage.hint + '</span></div><b>' + items.length + '</b></header>' +
          '<div class="cards">' + (items.length ? items.map(cardHtml).join('') : '<p class="empty-col">—</p>') + '</div>' +
          '</section>';
      }).join('');
    }

    function expectedFiles(job) {
      var keys = ['spec.md', 'build.md'];
      var maxRound = Number(job.round) || 0;
      (Array.isArray(job.reviews) ? job.reviews : []).forEach(function (round) {
        maxRound = Math.max(maxRound, Number(round.round) || 0);
      });
      for (var round = 1; round <= maxRound; round++) {
        REVIEWERS.forEach(function (reviewer) {
          keys.push('round-' + round + '/review-' + reviewer[0] + '.md');
        });
      }
      keys.push('decision.md');
      return keys;
    }

    function fileOrder(key) {
      if (key === 'spec.md') return 0;
      if (key === 'build.md') return 1;
      if (key === 'decision.md') return 999;
      var match = key.match(/^round-(\d+)\/review-(security|ux|ui|code)\.md$/);
      if (match) {
        var roles = { security: 0, ux: 1, ui: 2, code: 3 };
        return 10 + Number(match[1]) * 10 + roles[match[2]];
      }
      return 500;
    }

    async function fetchJobFile(id, path) {
      var urls = ['../jobs/' + encodeURIComponent(id) + '/' + path, 'jobs/' + encodeURIComponent(id) + '/' + path];
      for (var i = 0; i < urls.length; i++) {
        try {
          var response = await fetch(urls[i], { cache: 'no-store' });
          if (!response.ok) continue;
          var text = await response.text();
          if (/^\s*<!doctype|<html/i.test(text)) continue;
          return text;
        } catch (error) { /* siguiente ruta */ }
      }
      return null;
    }

    async function loadFiles(job) {
      var artifacts = job.artifacts && typeof job.artifacts === 'object' ? job.artifacts : {};
      var keys = Object.keys(artifacts).length ? Object.keys(artifacts) : expectedFiles(job);
      var files = await Promise.all(keys.map(async function (key) {
        var content = typeof artifacts[key] === 'string' ? artifacts[key] : null;
        if (content == null) content = await fetchJobFile(job.id, key);
        return { key: key, content: content };
      }));
      files.sort(function (a, b) { return fileOrder(a.key) - fileOrder(b.key); });
      return files;
    }

    function selectFile(key, files) {
      var tabs = fileTabsEl.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i].dataset.file === key);
      var file = null;
      for (var j = 0; j < files.length; j++) if (files[j].key === key) file = files[j];
      fileBodyEl.innerHTML = renderMarkdown(file ? file.content : null);
      fileBodyEl.scrollTop = 0;
    }

    async function renderDrawer(job) {
      var token = ++drawerToken;
      drawerIdEl.textContent = job.id || '';
      drawerTitleEl.textContent = job.title || job.id || '';
      fileTabsEl.innerHTML = '';
      fileBodyEl.innerHTML = '<p class="empty">Cargando archivos…</p>';

      var files = await loadFiles(job);
      if (token !== drawerToken) return;

      fileTabsEl.innerHTML = files.map(function (file) {
        return '<button class="tab' + (file.content == null ? ' missing' : '') + '" data-file="' + escAttr(file.key) + '">' + escapeHtml(file.key) + '</button>';
      }).join('');

      var available = files.filter(function (file) { return file.content != null; });
      if (!available.length) {
        fileBodyEl.innerHTML = '<div class="pending"><strong>Sin archivos publicados todavía.</strong>' +
          '<p>El orquestador copia el Markdown a <code>board.json</code> cuando avanza cada etapa. Archivos esperados:</p>' +
          '<ul>' + files.map(function (file) { return '<li><code>' + escapeHtml(file.key) + '</code></li>'; }).join('') + '</ul></div>';
        return;
      }

      var tabs = fileTabsEl.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].addEventListener('click', function () { selectFile(this.dataset.file, files); });
      }
      selectFile(available[0].key, files);
    }

    function openDrawer(id) {
      var job = findJob(id);
      if (!job) return;
      selectedId = id;
      drawerEl.hidden = false;
      scrimEl.hidden = false;
      document.body.style.overflow = 'hidden';
      renderDrawer(job);
      document.getElementById('drawerClose').focus();
    }

    function closeDrawer() {
      selectedId = null;
      drawerToken++;
      drawerEl.hidden = true;
      scrimEl.hidden = true;
      document.body.style.overflow = '';
    }

    function showError(error) {
      alertEl.hidden = false;
      alertEl.innerHTML = '<strong>No se pudo leer board.json.</strong> ' +
        'Sirve la carpeta desde <code>factory/</code> con <code>python3 -m http.server</code> y abre ' +
        '<code>http://localhost:8000/dashboard.html</code>. Detalle: ' + escapeHtml(error && error.message ? error.message : String(error));
      serverHintEl.textContent = 'Sin conexión con board.json';
    }

    async function load() {
      try {
        var response = await fetch('board.json?ts=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var data = await response.json();
        alertEl.hidden = true;
        var signature = JSON.stringify(data);
        if (signature === lastSignature) {
          serverHintEl.textContent = 'Actualizado · polling cada 2 s';
          return;
        }
        lastSignature = signature;
        board = data && typeof data === 'object' ? data : { jobs: [] };
        render();
        var updated = board.updatedAt ? new Date(board.updatedAt) : null;
        var when = updated && !isNaN(updated.getTime())
          ? updated.toLocaleString('es', { dateStyle: 'short', timeStyle: 'short' })
          : 'sin fecha';
        serverHintEl.textContent = 'Última actualización · ' + when;
        if (selectedId) {
          var job = findJob(selectedId);
          if (job) renderDrawer(job); else closeDrawer();
        }
      } catch (error) {
        showError(error);
      }
    }

    pipelineEl.addEventListener('click', function (event) {
      var card = event.target.closest('[data-job]');
      if (card) openDrawer(card.dataset.job);
    });
    pipelineEl.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      var card = event.target.closest('[data-job]');
      if (!card) return;
      event.preventDefault();
      openDrawer(card.dataset.job);
    });
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    scrimEl.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !drawerEl.hidden) closeDrawer();
    });

    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
